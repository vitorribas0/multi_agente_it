<div class="sidebar-history">
  <button class="new-chat-btn" type="button" (click)="newChat()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"/>
      <line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
    <span>Nova conversa</span>
  </button>

  <span class="nav-section-label">Histórico</span>

  <div class="history-list">
    <p class="history-empty" *ngIf="!conversations.length">Nenhuma conversa salva ainda.</p>

    <div class="history-item" *ngFor="let conv of conversations; trackBy: trackConv"
         [class.active]="isActive(conv)">
      <!-- Modo edição inline -->
      <input *ngIf="renamingId === conv.id"
             class="history-rename-input"
             type="text"
             maxlength="120"
             [(ngModel)]="renameText"
             (keydown)="onRenameKeydown($event, conv)"
             (blur)="commitRename(conv)"
             (click)="$event.stopPropagation()"
             appAutofocus />

      <!-- Modo normal -->
      <a *ngIf="renamingId !== conv.id" class="history-item-link" href="#"
         (click)="$event.preventDefault(); open(conv)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <span class="history-item-title">{{ conv.title }}</span>
      </a>

      <div class="history-actions" *ngIf="renamingId !== conv.id">
        <button class="history-edit-btn" type="button" title="Renomear conversa" (click)="startRename(conv, $event)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>
          </svg>
        </button>
        <button class="history-delete-btn" type="button" title="Excluir conversa" (click)="remove(conv, $event)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
            <path d="M10 11v6M14 11v6"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
