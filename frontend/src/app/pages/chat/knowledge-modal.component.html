<div class="sa-modal-backdrop" [hidden]="!open" (click)="close()">
  <div class="sa-modal" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
    <div class="sa-modal-header">
      <div class="sa-modal-titlewrap">
        <span class="sa-modal-badge kb-modal-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 14l9-5-9-5-9 5 9 5z"/>
            <path d="M12 14l6.16-3.42A12 12 0 0 1 19 15.5a12 12 0 0 1-14 0 12 12 0 0 1 .84-4.92L12 14z"/>
            <path d="M12 14v7"/>
          </svg>
        </span>
        <div>
          <h2 class="sa-modal-title">Conhecimentos</h2>
          <p class="sa-modal-sub">Ative um ou mais — o conteúdo é injetado no contexto do orquestrador</p>
        </div>
      </div>
      <button class="sa-modal-close" type="button" (click)="close()" title="Fechar (Esc)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="sa-modal-body">
      <div class="sa-field">
        <label for="know-search">Buscar conhecimento</label>
        <input type="text" id="know-search" placeholder="Buscar por nome ou descrição…" [(ngModel)]="search" />
      </div>
      <div class="know-multi-warn" [hidden]="!showMultiWarn">
        ⚠️ Vários conhecimentos ativos ao mesmo tempo — eles serão combinados no contexto.
      </div>
      <div class="sa-field">
        <label>Conhecimentos cadastrados <span class="sa-tools-count">{{ count }} selecionado(s)</span></label>
        <div class="kb-list">
          <div class="kb-empty" *ngIf="loading">Carregando…</div>
          <div class="kb-empty" *ngIf="!loading && !filtered.length">Nenhum conhecimento cadastrado.</div>
          <table class="kb-table" *ngIf="!loading && filtered.length">
            <thead>
              <tr>
                <th></th>
                <th>Nome</th>
                <th>Descrição</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let k of filtered"
                  class="kb-row"
                  [class.selected]="isSelected(k.id)"
                  [class.disabled]="isDisabled(k.id)"
                  (click)="!isDisabled(k.id) && toggle(k)">
                <td class="kb-cell-check">
                  <input type="checkbox" [checked]="isSelected(k.id)" [disabled]="isDisabled(k.id)"
                         (click)="$event.preventDefault()" />
                </td>
                <td class="kb-cell-name">{{ k.icon || '📚' }} {{ k.name }}</td>
                <td class="kb-cell-desc" [title]="k.description">{{ k.description }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="sa-modal-footer">
      <div class="sa-footer-left">
        <button class="sa-btn ghost" type="button" (click)="clear()">Limpar seleção</button>
      </div>
      <div class="sa-footer-right">
        <button class="sa-btn ghost" type="button" (click)="close()">Cancelar</button>
        <button class="sa-btn primary" type="button" (click)="onSave()">Salvar</button>
      </div>
    </div>
  </div>
</div>
