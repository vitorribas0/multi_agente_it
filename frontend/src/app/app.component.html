<div class="app">
  <button class="sidebar-collapse-btn"
          [class.is-collapsed]="sidebarCollapsed"
          [attr.aria-label]="sidebarCollapsed ? 'Expandir menu lateral' : 'Minimizar menu lateral'"
          [attr.aria-expanded]="!sidebarCollapsed"
          [title]="sidebarCollapsed ? 'Expandir menu lateral' : 'Minimizar menu lateral'"
          (click)="toggleSidebar()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M15 18l-6-6 6-6"/>
    </svg>
  </button>

  <!-- Sidebar (espelha base.html) -->
  <aside class="sidebar" id="sidebar" [class.collapsed]="sidebarCollapsed">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <div class="brand-icon">🛡️</div>
        <div>
          <div class="brand-name">Multi-Agentes Auditoria</div>
          <div class="brand-sub">Auditoria multiagente</div>
        </div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <span class="nav-section-label">Navegação</span>
      <a routerLink="/chat" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">💬</span>
        <span>Chat</span>
      </a>
      <a routerLink="/playbooks" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">📐</span>
        <span>Playbooks</span>
      </a>
      <a routerLink="/settings" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">⚙️</span>
        <span>Configurações</span>
      </a>
    </nav>

    <app-history-list></app-history-list>

    <div class="sidebar-footer">
      <div class="sidebar-info">
        <span class="info-dot"></span>
        <span>Multiagente ativo</span>
      </div>
    </div>
  </aside>

  <main class="main">
    <router-outlet></router-outlet>
  </main>
</div>
