<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configurações — MCP Reclamações</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-main:    #212121;
      --bg-sidebar: #171717;
      --bg-card:    #2a2a2a;
      --bg-input:   #2f2f2f;
      --border:     #3a3a3a;
      --accent:     #10a37f;
      --accent-dim: rgba(16,163,127,.15);
      --text:       #ececec;
      --text-muted: #8e8ea0;
      --text-dim:   #b4b4b4;
      --tag-bg:     #1a3a2e;
      --tag-text:   #4ade80;
      --badge-bg:   #1e2d4a;
      --badge-text: #60a5fa;
      --warn-bg:    #2d2010;
      --warn-text:  #fbbf24;
      --radius:     12px;
      --radius-sm:  8px;
    }

    body {
      background: var(--bg-main);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Sidebar ─────────────────────────────────────────── */
    .sidebar {
      width: 260px;
      background: var(--bg-sidebar);
      display: flex;
      flex-direction: column;
      padding: 20px 12px;
      border-right: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      margin-bottom: 24px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    .sidebar-brand .icon {
      font-size: 20px;
    }

    .nav-section {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 0 12px;
      margin-bottom: 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      color: var(--text-dim);
      text-decoration: none;
      transition: background .15s, color .15s;
      cursor: pointer;
      margin-bottom: 2px;
    }

    .nav-item:hover { background: rgba(255,255,255,.06); color: var(--text); }
    .nav-item.active { background: rgba(16,163,127,.15); color: var(--accent); }

    .nav-item .nav-icon { font-size: 16px; width: 20px; text-align: center; }

    /* ── Main ────────────────────────────────────────────── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      padding: 20px 32px 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .topbar h1 {
      font-size: 22px;
      font-weight: 600;
    }

    .topbar p {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: -8px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 4px;
    }

    .tab-btn {
      padding: 8px 18px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color .15s, border-color .15s;
    }

    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--accent); border-color: var(--accent); }

    /* Content area */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 28px 32px;
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── Cards ───────────────────────────────────────────── */
    .section-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 22px;
      margin-bottom: 16px;
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-desc {
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.55;
      margin-bottom: 14px;
    }

    /* Status badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
    }

    .badge.green { background: var(--tag-bg); color: var(--tag-text); }
    .badge.blue  { background: var(--badge-bg); color: var(--badge-text); }
    .badge.yellow { background: var(--warn-bg); color: var(--warn-text); }

    .badge::before { content: "●"; font-size: 8px; }

    /* Params table */
    .params-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-top: 10px;
    }

    .params-table th {
      text-align: left;
      color: var(--text-muted);
      font-weight: 500;
      padding: 6px 10px;
      border-bottom: 1px solid var(--border);
    }

    .params-table td {
      padding: 7px 10px;
      border-bottom: 1px solid rgba(255,255,255,.04);
      color: var(--text-dim);
    }

    .params-table tr:last-child td { border-bottom: none; }

    .param-name { font-family: monospace; color: var(--text); font-size: 12.5px; }

    .req-tag {
      display: inline-block;
      background: rgba(239,68,68,.15);
      color: #f87171;
      font-size: 11px;
      padding: 1px 7px;
      border-radius: 4px;
    }

    .opt-tag {
      display: inline-block;
      background: rgba(255,255,255,.07);
      color: var(--text-muted);
      font-size: 11px;
      padding: 1px 7px;
      border-radius: 4px;
    }

    /* Tool list in agent card */
    .tool-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .tool-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--accent-dim);
      color: var(--accent);
      border: 1px solid rgba(16,163,127,.3);
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-family: monospace;
    }
    .tool-chip-btn {
      cursor: pointer;
      transition: transform .12s ease, filter .12s ease;
    }
    .tool-chip-btn:hover { transform: translateY(-1px); filter: brightness(1.08); }

    .tool-open-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(16,163,127,.35);
      background: rgba(16,163,127,.12);
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
    }
    .tool-open-btn:hover {
      background: rgba(16,163,127,.2);
      border-color: rgba(16,163,127,.55);
    }

    /* Model info */
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .meta-item { display: flex; flex-direction: column; gap: 3px; }
    .meta-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; }
    .meta-value { font-size: 13px; color: var(--text); font-weight: 500; }
    .meta-value.mono { font-family: monospace; color: var(--accent); }

    /* Agent flow graph */
    .agent-graph-wrap {
      margin-top: 12px;
      background: #161616;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 20px 16px;
      overflow-x: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 120px;
    }
    .agent-graph-wrap svg {
      max-width: 100%;
      height: auto;
    }
    .agent-graph-wrap .nodeLabel,
    .agent-graph-wrap .label,
    .agent-graph-wrap foreignObject {
      line-height: 1.28 !important;
    }
    .agent-graph-inner {
      width: 100%;
      display: flex;
      justify-content: center;
    }
    .graph-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 8px;
      text-align: center;
      letter-spacing: .3px;
    }
    details.graph-section {
      margin-top: 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    details.graph-section summary {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-dim);
      cursor: pointer;
      user-select: none;
      padding: 10px 14px;
      background: rgba(255,255,255,.03);
      list-style: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    details.graph-section summary::-webkit-details-marker { display: none; }
    details.graph-section summary::after {
      content: '›';
      margin-left: auto;
      font-size: 16px;
      transition: transform .2s;
      color: var(--text-muted);
    }
    details.graph-section[open] summary::after { transform: rotate(90deg); }
    details.graph-section summary:hover { color: var(--accent); background: rgba(16,163,127,.07); }
    details.graph-section[open] { border-color: rgba(16,163,127,.3); }

    /* Tool detail modal */
    .tool-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(2px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .tool-modal-backdrop.open { display: flex; }
    .tool-modal {
      width: min(980px, 95vw);
      max-height: 92vh;
      overflow: auto;
      background: #202020;
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 14px 50px rgba(0,0,0,.4);
    }
    .tool-modal-head {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: #202020;
      z-index: 1;
    }
    .tool-modal-title {
      font-size: 14px;
      font-family: monospace;
      color: var(--accent);
      font-weight: 700;
    }
    .tool-modal-close {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 30px;
      height: 30px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
    }
    .tool-modal-close:hover { color: var(--text); border-color: #4a4a4a; }
    .tool-modal-body { padding: 16px; }
    .tool-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    .tool-pane {
      background: #181818;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
    }
    .tool-pane h3 {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 10px;
    }
    .tool-flow-list {
      margin: 0;
      padding-left: 20px;
      color: var(--text-dim);
      font-size: 12px;
      line-height: 1.45;
    }
    .tool-flow-graph {
      margin-top: 10px;
      background: #141414;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      overflow-x: auto;
      min-height: 88px;
    }
    .tool-flow-graph svg {
      min-width: 100%;
      height: auto;
    }
    .tool-flow-graph .nodeLabel,
    .tool-flow-graph .label,
    .tool-flow-graph foreignObject {
      font-size: 10px !important;
      line-height: 1.24 !important;
    }
    .tool-flow-tree {
      margin-top: 8px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #131313;
    }
    .tree-node {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 2px 8px;
      border-radius: 7px;
      border: 1px solid #2f2f2f;
      background: #181818;
      color: var(--text-dim);
      font-size: 11px;
      line-height: 1.3;
    }
    .tree-node.start {
      border-color: #60a5fa;
      background: #1e2d4a;
      color: #c8d8ff;
      font-weight: 600;
    }
    .tree-node.end {
      border-color: #10a37f;
      background: #1a3a2e;
      color: #cfffea;
      font-weight: 600;
    }
    .tree-root {
      margin: 0 0 8px 0;
    }
    .tree-root.end {
      margin: 8px 0 0 0;
    }
    .tree-list {
      margin: 0;
      padding: 0 0 0 16px;
      list-style: none;
      border-left: 1px solid #2f2f2f;
    }
    .tree-list li {
      position: relative;
      margin: 6px 0;
      padding-left: 12px;
    }
    .tree-list li::before {
      content: '';
      position: absolute;
      left: -1px;
      top: 11px;
      width: 12px;
      border-top: 1px solid #2f2f2f;
    }
    .tool-steps-details {
      margin-top: 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #131313;
      overflow: hidden;
    }
    .tool-steps-details summary {
      cursor: pointer;
      user-select: none;
      padding: 8px 10px;
      font-size: 11px;
      color: var(--text-muted);
      background: rgba(255,255,255,.02);
    }
    .tool-steps-details[open] summary { color: var(--accent); }
    .tool-steps-details .tool-flow-list {
      padding: 8px 10px 10px 24px;
    }
    .tool-code {
      margin: 0;
      white-space: pre;
      overflow: auto;
      font-family: Consolas, "Courier New", monospace;
      font-size: 12px;
      line-height: 1.55;
      color: #d4d4d4;
    }
    .tool-loading {
      color: var(--text-muted);
      font-size: 13px;
    }

    /* System prompt preview */
    .prompt-preview {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      font-size: 12.5px;
      color: var(--text-dim);
      line-height: 1.6;
      white-space: pre-wrap;
      font-family: monospace;
      max-height: 150px;
      overflow-y: auto;
      margin-top: 10px;
    }

    /* ── Models tab ──────────────────────────────────────── */
    .model-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    .model-picker-card {
      margin-bottom: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }
    .model-picker-label {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .model-picker-select {
      min-width: 280px;
      max-width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      font-family: monospace;
      outline: none;
    }
    .model-picker-select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(16,163,127,.15);
    }
    .model-picker-note {
      width: 100%;
      font-size: 12px;
      color: var(--text-muted);
    }

    .model-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
    }

    .model-name {
      font-size: 14px;
      font-weight: 600;
      font-family: monospace;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .model-provider {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .model-agents {
      font-size: 12px;
      color: var(--text-dim);
    }

    .model-agents span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(255,255,255,.06);
      padding: 2px 8px;
      border-radius: 5px;
      margin-right: 4px;
      margin-top: 4px;
    }

    /* Spinner */
    .loading {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-muted);
      font-size: 14px;
      padding: 40px 0;
    }

    .spinner {
      width: 18px; height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── MCP Tree ─────────────────────────────────────────────── */
    .mcp-group {
      margin-bottom: 28px;
    }
    .mcp-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg-card);
      margin-bottom: 4px;
      user-select: none;
    }
    .mcp-icon {
      font-size: 22px;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      flex-shrink: 0;
    }
    .mcp-label {
      flex: 1;
    }
    .mcp-label h2 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 2px;
    }
    .mcp-label p {
      font-size: 12px;
      color: var(--text-muted);
    }
    .mcp-badge {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid;
      font-weight: 600;
    }

    /* Tree connector lines */
    .mcp-tree {
      padding-left: 22px;
      border-left: 2px solid var(--border);
      margin-left: 18px;
      margin-top: 2px;
    }
    .tree-agent {
      position: relative;
      margin-bottom: 8px;
    }
    .tree-agent::before {
      content: '';
      position: absolute;
      left: -22px;
      top: 22px;
      width: 20px;
      height: 2px;
      background: var(--border);
    }
    .agent-node {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      transition: border-color .2s;
    }
    .agent-node:hover {
      border-color: #555;
    }
    .agent-node-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      cursor: pointer;
      transition: background .15s;
    }
    .agent-node-header:hover {
      background: var(--bg-hover);
    }
    .agent-node-icon {
      font-size: 18px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      flex-shrink: 0;
    }
    .agent-node-name {
      flex: 1;
      font-weight: 600;
      font-size: 14px;
    }
    .agent-node-id {
      font-size: 11px;
      color: var(--text-muted);
      font-family: monospace;
    }
    .agent-node-status {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
    }
    .agent-node-status.ativo {
      background: rgba(16,163,127,.15);
      color: #10a37f;
      border: 1px solid rgba(16,163,127,.3);
    }
    .agent-expand-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      font-size: 14px;
      transition: transform .2s, color .2s;
      flex-shrink: 0;
    }
    .agent-expand-btn.open {
      transform: rotate(90deg);
      color: var(--text-primary);
    }
    .agent-node-body {
      display: none;
      padding: 0 16px 14px 16px;
      border-top: 1px solid var(--border);
    }
    .agent-node-body.open {
      display: block;
    }
    .agent-node-desc {
      font-size: 13px;
      color: var(--text-dim);
      margin: 10px 0 12px;
    }
    .agent-tools-tree {
      padding-left: 16px;
      border-left: 2px solid #2a2a3a;
      margin-bottom: 12px;
    }
    .tool-tree-item {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
      font-size: 12px;
      color: var(--text-dim);
    }
    .tool-tree-item::before {
      content: '';
      position: absolute;
      left: -16px;
      top: 50%;
      width: 14px;
      height: 2px;
      background: #2a2a3a;
    }
    .tool-tree-btn {
      background: none;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 12px;
      color: var(--accent);
      cursor: pointer;
      font-family: monospace;
      transition: background .15s, border-color .15s;
    }
    .tool-tree-btn:hover {
      background: rgba(16,163,127,.1);
      border-color: rgba(16,163,127,.3);
    }
    .agent-prompt-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
      color: var(--text-dim);
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
      font-family: var(--font);
    }
    .agent-prompt-btn:hover {
      background: var(--bg-hover);
      border-color: #555;
      color: var(--text-primary);
    }
    .agent-meta-row {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .agent-meta-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .agent-meta-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text-muted);
      font-weight: 600;
    }
    .agent-meta-value {
      font-size: 12px;
      color: var(--text-primary);
      font-family: monospace;
    }

    /* Agent prompt modal */
    .prompt-modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.65);
      z-index: 300;
      align-items: center;
      justify-content: center;
    }
    .prompt-modal-backdrop.open {
      display: flex;
    }
    .prompt-modal {
      background: #1c1c1c;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: min(780px, 94vw);
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .prompt-modal-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    .prompt-modal-title {
      flex: 1;
      font-size: 15px;
      font-weight: 700;
    }
    .prompt-modal-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 22px;
      cursor: pointer;
      line-height: 1;
      padding: 0 4px;
      transition: color .15s;
    }
    .prompt-modal-close:hover { color: var(--text-primary); }
    .prompt-modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    .prompt-modal-body pre {
      white-space: pre-wrap;
      font-family: 'Inter', monospace;
      font-size: 13px;
      line-height: 1.7;
      color: #d4d4d4;
      background: #141414;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin: 0;
    }

    /* Scrollbar */
    .content::-webkit-scrollbar { width: 5px; }
    .content::-webkit-scrollbar-track { background: transparent; }
    .content::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 3px; }
  </style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
  <div class="sidebar-brand">
    <span class="icon">🔍</span>
    MCP Reclamações
  </div>

  <div class="nav-section">Navegação</div>
  <a href="/" class="nav-item">
    <span class="nav-icon">💬</span> Chat
  </a>
  <a href="/settings/" class="nav-item active">
    <span class="nav-icon">⚙️</span> Configurações
  </a>
</aside>

<!-- Main -->
<div class="main">
  <div class="topbar">
    <div>
      <h1>Configurações</h1>
      <p>Visualize as ferramentas, agentes e modelos do sistema MCP.</p>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="tools">🔧 Tools</button>
      <button class="tab-btn" data-tab="agents">🤖 Agentes</button>
      <button class="tab-btn" data-tab="models">🧠 Modelos</button>
    </div>
  </div>

  <div class="content">

    <!-- Tools -->
    <div class="tab-panel active" id="panel-tools">
      <div class="loading" id="tools-loading">
        <div class="spinner"></div> Carregando tools…
      </div>
      <div id="tools-list" style="display:none"></div>
    </div>

    <!-- Agents -->
    <div class="tab-panel" id="panel-agents">
      <div class="loading" id="agents-loading">
        <div class="spinner"></div> Carregando agentes…
      </div>
      <div id="agents-list" style="display:none"></div>
    </div>

    <!-- Models -->
    <div class="tab-panel" id="panel-models">
      <div class="loading" id="models-loading">
        <div class="spinner"></div> Carregando modelos…
      </div>
      <div id="models-list" style="display:none"></div>
    </div>

  </div>
</div>

<!-- Agent prompt modal -->
<div class="prompt-modal-backdrop" id="prompt-modal-backdrop" onclick="onPromptModalBackdrop(event)">
  <div class="prompt-modal">
    <div class="prompt-modal-head">
      <span id="prompt-modal-icon" style="font-size:22px"></span>
      <div class="prompt-modal-title" id="prompt-modal-title">System Prompt</div>
      <button class="prompt-modal-close" onclick="closePromptModal()">×</button>
    </div>
    <div class="prompt-modal-body">
      <pre id="prompt-modal-content"></pre>
    </div>
  </div>
</div>

<div class="tool-modal-backdrop" id="tool-modal-backdrop" onclick="onToolModalBackdrop(event)">
  <div class="tool-modal" role="dialog" aria-modal="true" aria-labelledby="tool-modal-title">
    <div class="tool-modal-head">
      <div class="tool-modal-title" id="tool-modal-title">Tool</div>
      <button class="tool-modal-close" type="button" onclick="closeToolDetail()" aria-label="Fechar">×</button>
    </div>
    <div class="tool-modal-body" id="tool-modal-body">
      <div class="tool-loading">Carregando detalhes da tool...</div>
    </div>
  </div>
</div>

<script>
  const TOOL_DETAIL_CACHE = {};

  // ── Tab switching ─────────────────────────────────────────
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    });
  });

  // ── Fetch settings data ───────────────────────────────────
  async function loadSettings() {
    const res = await fetch('/api/settings/');
    const data = await res.json();
    _agentsData = data.agents || [];
    renderTools(data.tools);
    renderAgents(data.agents);
    renderModels(data.agents, data.model_options || [], data.default_model);
  }

  // ── Tools ─────────────────────────────────────────────────
  function renderTools(tools) {
    const container = document.getElementById('tools-list');
    document.getElementById('tools-loading').style.display = 'none';
    container.style.display = 'block';

    container.innerHTML = `<p class="section-title">${tools.length} tool${tools.length !== 1 ? 's' : ''} registrada${tools.length !== 1 ? 's' : ''}</p>`;

    tools.forEach(tool => {
      const params = Object.entries(tool.parameters);
      const paramsHtml = params.length
        ? `
          <table class="params-table">
            <thead><tr>
              <th>Parâmetro</th><th>Tipo</th><th>Descrição</th><th>Obrigatório</th>
            </tr></thead>
            <tbody>
              ${params.map(([key, meta]) => `
                <tr>
                  <td><span class="param-name">${key}</span></td>
                  <td style="color:var(--text-muted)">${meta.type || '—'}</td>
                  <td>${meta.description || '—'}</td>
                  <td>${tool.required.includes(key)
                    ? '<span class="req-tag">obrigatório</span>'
                    : '<span class="opt-tag">opcional</span>'
                  }</td>
                </tr>
              `).join('')}
            </tbody>
          </table>`
        : '<p style="font-size:13px;color:var(--text-muted);margin-top:8px">Sem parâmetros.</p>';

      container.innerHTML += `
        <div class="card">
          <div class="card-header">
            <div class="card-title">
              <span>⚡</span>
              <code style="font-size:15px">${tool.name}</code>
            </div>
            <span class="badge green">ativa</span>
          </div>
          <p class="card-desc">${tool.description}</p>
          <button class="tool-open-btn" type="button" onclick="openToolDetail('${tool.name}')">📖 Ver funcionamento e código</button>
          ${paramsHtml}
        </div>`;
    });
  }

  // ── Agents ────────────────────────────────────────────────
  // ── Agents (MCP Tree) ──────────────────────────────────────
  const MCP_GROUPS = [
    {
      id: 'mcp_reclamacao',
      label: 'MCP Reclamação',
      icon: '📋',
      color: '#60a5fa',
      bg: 'rgba(96,165,250,.12)',
      desc: 'Agentes especializados em análise de reclamações e conformidade',
      agents: ['orquestrador', 'analise_massiva', 'gerador_sql'],
    },
    {
      id: 'mcp_anomalias',
      label: 'MCP Anomalias',
      icon: '🔍',
      color: '#10a37f',
      bg: 'rgba(16,163,127,.12)',
      desc: 'Agentes para detecção de anomalias e análise estatística em dados corporativos',
      agents: ['agente_anomalias'],
    },
  ];

  const AGENT_ICONS = {
    orquestrador: '🧠',
    analise_massiva: '🤖',
    gerador_sql: '💾',
    agente_anomalias: '🔍',
  };

  function renderAgents(agents) {
    const container = document.getElementById('agents-list');
    document.getElementById('agents-loading').style.display = 'none';
    container.style.display = 'block';

    const agentMap = {};
    agents.forEach(a => agentMap[a.id] = a);

    let html = '';
    MCP_GROUPS.forEach(group => {
      const groupAgents = group.agents.map(id => agentMap[id]).filter(Boolean);
      if (!groupAgents.length) return;
      const toolCount = groupAgents.reduce((s, a) => s + (a.tools || []).length, 0);
      html += `
        <div class="mcp-group">
          <div class="mcp-header">
            <div class="mcp-icon" style="background:${group.bg}">${group.icon}</div>
            <div class="mcp-label">
              <h2 style="color:${group.color}">${group.label}</h2>
              <p>${group.desc}</p>
            </div>
            <span class="mcp-badge" style="color:${group.color};border-color:${group.color}40">
              ${groupAgents.length} agente${groupAgents.length !== 1 ? 's' : ''} · ${toolCount} tools
            </span>
          </div>
          <div class="mcp-tree">
            ${groupAgents.map(agent => renderAgentNode(agent, group.color)).join('')}
          </div>
        </div>`;
    });

    // Agentes sem grupo
    const grouped = MCP_GROUPS.flatMap(g => g.agents);
    const ungrouped = agents.filter(a => !grouped.includes(a.id));
    if (ungrouped.length) {
      html += `<div class="mcp-group">
        <div class="mcp-header">
          <div class="mcp-icon" style="background:rgba(100,100,100,.15)">🤖</div>
          <div class="mcp-label"><h2>Outros Agentes</h2><p>Agentes não categorizados</p></div>
        </div>
        <div class="mcp-tree">${ungrouped.map(a => renderAgentNode(a, '#888')).join('')}</div>
      </div>`;
    }

    container.innerHTML = html;

    // Toggle expand/collapse
    document.querySelectorAll('.agent-node-header').forEach(header => {
      header.addEventListener('click', () => {
        const node = header.closest('.agent-node');
        const body = node.querySelector('.agent-node-body');
        const btn = node.querySelector('.agent-expand-btn');
        body.classList.toggle('open');
        btn.classList.toggle('open');
      });
    });
  }

  function renderAgentNode(agent, accentColor) {
    const icon = AGENT_ICONS[agent.id] || '🤖';
    const toolsHtml = (agent.tools || []).map(t => `
      <div class="tool-tree-item">
        <span style="color:#555">⚡</span>
        <button class="tool-tree-btn" onclick="event.stopPropagation(); openToolDetail('${t}')">${t}</button>
      </div>`).join('');

    return `
      <div class="tree-agent">
        <div class="agent-node">
          <div class="agent-node-header">
            <div class="agent-node-icon" style="background:${accentColor}20">${icon}</div>
            <div class="agent-node-name">${agent.name}</div>
            <span class="agent-node-id">${agent.id}</span>
            <span class="agent-node-status ${agent.status || 'ativo'}">${agent.status || 'ativo'}</span>
            <button class="agent-expand-btn" title="Expandir">&#9654;</button>
          </div>
          <div class="agent-node-body">
            <p class="agent-node-desc">${agent.description}</p>
            <p style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;font-weight:600">
              Tools coordenadas (${(agent.tools||[]).length})
            </p>
            <div class="agent-tools-tree">${toolsHtml}</div>
            <div style="display:flex;gap:10px;flex-wrap:wrap">
              <button class="agent-prompt-btn" onclick="openPromptModal('${agent.id}')">
                📝 Ver System Prompt
              </button>
            </div>
            <div class="agent-meta-row">
              <div class="agent-meta-item">
                <span class="agent-meta-label">Modelo</span>
                <span class="agent-meta-value">${agent.model}</span>
              </div>
              <div class="agent-meta-item">
                <span class="agent-meta-label">Provedor</span>
                <span class="agent-meta-value">${agent.provider || 'azure_openai'}</span>
              </div>
              <div class="agent-meta-item">
                <span class="agent-meta-label">Tools</span>
                <span class="agent-meta-value">${(agent.tools||[]).length} vinculadas</span>
              </div>
            </div>
          </div>
        </div>
      </div>`;
  }

  // Agent prompt modal
  function openPromptModal(agentId) {
    const agent = _agentsData.find(a => a.id === agentId);
    if (!agent) return;
    const icon = AGENT_ICONS[agentId] || '🤖';
    document.getElementById('prompt-modal-icon').textContent = icon;
    document.getElementById('prompt-modal-title').textContent = agent.name + ' — System Prompt';
    document.getElementById('prompt-modal-content').textContent = agent.system_prompt || '(sem prompt definido)';
    document.getElementById('prompt-modal-backdrop').classList.add('open');
  }

  function closePromptModal() {
    document.getElementById('prompt-modal-backdrop').classList.remove('open');
  }

  function onPromptModalBackdrop(event) {
    if (event.target.id === 'prompt-modal-backdrop') closePromptModal();
  }

  function onToolModalBackdrop(event) {
    if (event.target.id === 'tool-modal-backdrop') closeToolDetail();
  }

  function closeToolDetail() {
    document.getElementById('tool-modal-backdrop').classList.remove('open');
  }

  async function openToolDetail(toolName) {
    const backdrop = document.getElementById('tool-modal-backdrop');
    const body = document.getElementById('tool-modal-body');
    const title = document.getElementById('tool-modal-title');

    backdrop.classList.add('open');
    title.textContent = toolName;
    body.innerHTML = '<div class="tool-loading">Carregando detalhes da tool...</div>';

    try {
      const detail = await fetchToolDetail(toolName);
      body.innerHTML = `
        <div class="tool-grid">
          <div class="tool-pane">
            <h3>Como Funciona</h3>
            <div class="tool-flow-tree" id="tool-flow-tree"></div>
            <details class="tool-steps-details">
              <summary>Ver passos detalhados</summary>
              <ol class="tool-flow-list">
                ${detail.flow_summary.map(step => `<li>${escapeHtml(step)}</li>`).join('')}
              </ol>
            </details>
          </div>
          <div class="tool-pane">
            <h3>Código Da Função</h3>
            <pre class="tool-code"><code>${escapeHtml(detail.source_code)}</code></pre>
          </div>
        </div>`;

      renderToolFlowTree(detail.flow_summary);
    } catch (e) {
      body.innerHTML = `<div class="tool-loading">Não foi possível carregar os detalhes da tool.</div>`;
      console.error('Tool detail error:', e);
    }
  }

  async function fetchToolDetail(toolName) {
    if (TOOL_DETAIL_CACHE[toolName]) return TOOL_DETAIL_CACHE[toolName];
    const res = await fetch(`/api/tool-detail/?name=${encodeURIComponent(toolName)}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Erro ao buscar detalhe da tool');
    TOOL_DETAIL_CACHE[toolName] = data;
    return data;
  }

  function renderToolFlowTree(steps) {
    const el = document.getElementById('tool-flow-tree');
    if (!el) return;
    const items = steps
      .map((step, i) => `<li><span class="tree-node">E${i + 1}: ${escapeHtml(compactStepText(step))}</span></li>`)
      .join('');

    el.innerHTML = `
      <div class="tree-root"><span class="tree-node start">Início</span></div>
      <ul class="tree-list">${items}</ul>
      <div class="tree-root end"><span class="tree-node end">Fim</span></div>
    `;
  }

  function compactStepText(stepText) {
    const s = String(stepText || '').replace(/\s+/g, ' ').trim();
    if (!s) return 'Etapa';
    return s.length > 52 ? `${s.slice(0, 49)}...` : s;
  }

  // ── Models ────────────────────────────────────────────────
  function renderModels(agents, modelOptions = [], defaultModel = '') {
    const container = document.getElementById('models-list');
    document.getElementById('models-loading').style.display = 'none';
    container.style.display = 'block';

    const savedModel = localStorage.getItem('mcp_selected_model') || '';
    const selectedModel = modelOptions.includes(savedModel)
      ? savedModel
      : (modelOptions.includes(defaultModel) ? defaultModel : (modelOptions[0] || defaultModel || ''));

    if (selectedModel) {
      localStorage.setItem('mcp_selected_model', selectedModel);
    }

    // Carrega modelos salvos por agente
    const savedAgentModels = JSON.parse(localStorage.getItem('mcp_agent_models') || '{}');

    container.innerHTML = `
      <div class="model-picker-card">
        <div class="model-picker-label">Modelo ativo no chat</div>
        <select class="model-picker-select" id="model-picker-select">
          ${modelOptions.map(m => `<option value="${m}" ${m === selectedModel ? 'selected' : ''}>${m}</option>`).join('')}
        </select>
        <div class="model-picker-note">A seleção é aplicada às próximas mensagens no chat.</div>
      </div>
      
      <p class="section-title" style="margin-top:28px">Configuração de Modelos por Agente</p>
      <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;margin-bottom:20px">
        <p style="font-size:13px;color:var(--text-dim);margin-bottom:16px">Configure qual modelo cada agente deve utilizar. As mudanças são aplicadas nas próximas execuções.</p>
        <div id="agent-model-configs"></div>
        <button id="save-agent-models-btn" style="margin-top:16px;padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .2s">💾 Salvar Configurações</button>
        <div id="save-status" style="margin-top:10px;font-size:13px;display:none"></div>
      </div>
      
      <p class="section-title">Resumo de Uso</p>
      <div class="model-grid" id="model-summary-grid"></div>`;

    // Renderiza configurações editáveis por agente
    const configsContainer = document.getElementById('agent-model-configs');
    agents.forEach(agent => {
      const currentModel = savedAgentModels[agent.id] || agent.model;
      const optionsHtml = modelOptions.map(m => 
        `<option value="${m}" ${m === currentModel ? 'selected' : ''}>${m}</option>`
      ).join('');
      
      configsContainer.innerHTML += `
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap">
          <div style="min-width:200px;flex:1">
            <div style="font-size:14px;font-weight:600;margin-bottom:4px">🤖 ${agent.name}</div>
            <div style="font-size:12px;color:var(--text-muted)">${agent.description.substring(0, 80)}...</div>
          </div>
          <select class="model-picker-select agent-model-select" data-agent-id="${agent.id}" style="min-width:250px">
            ${optionsHtml}
          </select>
        </div>`;
    });

    // Renderiza resumo de uso
    const summaryGrid = document.getElementById('model-summary-grid');
    const byModel = {};
    agents.forEach(agent => {
      const currentModel = savedAgentModels[agent.id] || agent.model;
      const key = currentModel + '|' + agent.provider;
      if (!byModel[key]) byModel[key] = { model: currentModel, provider: agent.provider, agents: [] };
      byModel[key].agents.push(agent.name);
    });

    const models = Object.values(byModel);
    models.forEach(m => {
      const agentTags = m.agents.map(a => `<span>🤖 ${a}</span>`).join('');
      summaryGrid.innerHTML += `
        <div class="model-card">
          <div class="model-name">${m.model}</div>
          <div class="model-provider">Provedor: ${m.provider}</div>
          <div class="model-agents">
            <span style="color:var(--text-muted);font-size:11px;display:block;margin-bottom:4px">USADO POR</span>
            ${agentTags}
          </div>
        </div>`;
    });

    // Event listeners
    const picker = document.getElementById('model-picker-select');
    if (picker) {
      picker.addEventListener('change', () => {
        localStorage.setItem('mcp_selected_model', picker.value);
      });
    }

    const saveBtn = document.getElementById('save-agent-models-btn');
    if (saveBtn) {
      saveBtn.addEventListener('click', saveAgentModels);
    }
  }

  async function saveAgentModels() {
    const selects = document.querySelectorAll('.agent-model-select');
    const agentModels = {};
    
    selects.forEach(select => {
      agentModels[select.dataset.agentId] = select.value;
    });

    // Salva no localStorage
    localStorage.setItem('mcp_agent_models', JSON.stringify(agentModels));

    // Envia para o backend
    const statusEl = document.getElementById('save-status');
    const saveBtn = document.getElementById('save-agent-models-btn');
    
    saveBtn.disabled = true;
    saveBtn.style.opacity = '0.6';
    statusEl.style.display = 'block';
    statusEl.style.color = 'var(--text-muted)';
    statusEl.textContent = '⏳ Salvando configurações...';

    try {
      const res = await fetch('/api/save-agent-models/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ agent_models: agentModels })
      });
      
      const data = await res.json();
      
      if (res.ok) {
        statusEl.style.color = 'var(--tag-text)';
        statusEl.textContent = '✅ Configurações salvas com sucesso!';
        // Recarrega a página após 1.5s para refletir as mudanças
        setTimeout(() => location.reload(), 1500);
      } else {
        throw new Error(data.error || 'Erro ao salvar');
      }
    } catch (e) {
      statusEl.style.color = '#f87171';
      statusEl.textContent = '❌ Erro ao salvar: ' + e.message;
      saveBtn.disabled = false;
      saveBtn.style.opacity = '1';
    }
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function waitForMermaid(maxWaitMs = 4000) {
    const step = 80;
    let waited = 0;
    while (!window.mermaid && waited < maxWaitMs) {
      await new Promise(resolve => setTimeout(resolve, step));
      waited += step;
    }
    return !!window.mermaid;
  }

  async function bootstrapSettings() {
    const ok = await waitForMermaid();
    if (ok) {
      mermaid.initialize({
        startOnLoad: false,
        theme: 'dark',
        darkMode: true,
        securityLevel: 'loose',
        flowchart: {
